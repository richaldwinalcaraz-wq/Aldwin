<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#050505"/>

  <!-- Outer ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="white" stroke-width="4.5"/>

  <!-- Cross hairlines — gap in center for dot -->
  <line x1="50" y1="12" x2="50" y2="35" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="50" y1="65" x2="50" y2="88" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="50" x2="35" y2="50" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="65" y1="50" x2="88" y2="50" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="5.5" fill="white"/>

  <!-- Subtle inner ring -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>

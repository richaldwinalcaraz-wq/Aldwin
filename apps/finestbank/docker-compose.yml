version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: finestbank_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finestbank
      POSTGRES_PASSWORD: finestbank
      POSTGRES_DB: finestbank
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finestbank -d finestbank"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finestbank_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
